name: Ažuriranje vesti

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaliraj zavisnosti
        run: pip install -r requirements.txt

      - name: Povuci vesti i generiši sajt
        run: python fetch_news.py

      - name: Commit i push ako ima promena
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatsko ažuriranje vesti"
          file_pattern: "docs/*"
